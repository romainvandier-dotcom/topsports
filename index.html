<!DOCTYPE html>
<html>
<head>
<title>Top Sports</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
background:#0b1c3d;
font-family:Arial;
color:white;
text-align:center;
margin:0;
}

header{
background:#1e40af;
padding:15px;
font-size:22px;
font-weight:bold;
}

.container{
padding:15px;
}

.match{
background:#162447;
margin:12px;
padding:15px;
border-radius:10px;
}

.solide{color:#22c55e;}
.risque{color:#facc15;}
.eviter{color:#ef4444;}
.value{color:#ff7b00;}

input{
padding:8px;
border-radius:6px;
border:none;
margin:10px;
}

button{
padding:10px 20px;
border:none;
border-radius:8px;
background:#2563eb;
color:white;
font-weight:bold;
}

</style>
</head>

<body>

<header>Top Sports</header>

<div class="container">

<h3>Réglage</h3>

Cote minimum :  
<input id="coteMin" type="number" value="1.50" step="0.01">

<br>

<button onclick="afficherMatchs()">Analyser</button>

<h3>Matchs détectés</h3>

<div id="matchs"></div>

</div>

<script>

let matchs = [

{equipe:"Real Madrid vs Barcelone", cote:1.65, type:"solide"},
{equipe:"PSG vs Marseille", cote:2.10, type:"risque"},
{equipe:"Lakers vs Warriors", cote:1.85, type:"solide"},
{equipe:"Bayern vs Dortmund", cote:1.55, type:"solide"},
{equipe:"Chelsea vs Arsenal", cote:2.40, type:"risque"}

];

function afficherMatchs(){

let coteMin = document.getElementById("coteMin").value;
let zone = document.getElementById("matchs");

zone.innerHTML="";

matchs.forEach(match=>{

if(match.cote >= coteMin){

zone.innerHTML += `
<div class="match">
${match.equipe}<br>
Cote: ${match.cote}<br>
<span class="${match.type}">● ${match.type}</span>
</div>
`;

}

});

}

</script>

</body>
</html>

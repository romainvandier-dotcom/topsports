<!DOCTYPE html>
<html>
<head>
<title>Top Sports</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
background:#0b1c3d;
font-family:Arial;
color:white;
text-align:center;
margin:0;
}

header{
background:#1e40af;
padding:15px;
font-size:22px;
font-weight:bold;
}

.container{
padding:15px;
}

.match{
background:#162447;
margin:12px;
padding:15px;
border-radius:10px;
}

.solide{color:#22c55e;}
.risque{color:#facc15;}
.eviter{color:#ef4444;}
.value{color:#ff7b00;}

input{
padding:8px;
border-radius:6px;
border:none;
margin:10px;
}

button{
padding:10px 20px;
border:none;
border-radius:8px;
background:#2563eb;
color:white;
font-weight:bold;
}

</style>
</head>

<body>

<header>Top Sports</header>

<div class="container">

<h3>Réglage</h3>

Cote minimum :  
<input id="coteMin" type="number" value="1.50" step="0.01">

<br>

<button onclick="afficherMatchs()">Analyser</button>

<h3>Matchs détectés</h3>

<div id="matchs"></div>

</div>

<script>

<script>

let matchs = [

{sport:"⚽", equipe:"Real Madrid vs Barcelone", cote:1.65, proba:68, type:"solide"},
{sport:"⚽", equipe:"PSG vs Marseille", cote:2.10, proba:52, type:"risque"},
{sport:"🏀", equipe:"Lakers vs Warriors", cote:1.85, proba:60, type:"solide"},
{sport:"⚽", equipe:"Bayern vs Dortmund", cote:1.55, proba:70, type:"solide"},
{sport:"🏀", equipe:"Celtics vs Bulls", cote:1.95, proba:58, type:"value"},
{sport:"🏒", equipe:"Rangers vs Bruins", cote:2.20, proba:50, type:"risque"}

];

function afficherMatchs(){

let coteMin = document.getElementById("coteMin").value;
let zone = document.getElementById("matchs");

zone.innerHTML="";

matchs.forEach(match=>{

if(match.cote >= coteMin){

zone.innerHTML += `
<div class="match">

${match.sport} ${match.equipe}<br>
Cote: ${match.cote}<br>
Probabilité: ${match.proba}%<br>

<span class="${match.type}">● ${match.type}</span>

</div>
`;

}

});

}

</script>
